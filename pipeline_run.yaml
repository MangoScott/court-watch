# Edit and push this file to start a pipeline run on GitHub Actions
# (.github/workflows/pipeline.yml also accepts the same values from the
# "Run workflow" button). Each push that changes this file triggers one run.
state: OH
limit: 300         # sites to fetch imagery for this run, besides validation sites
offset: 0          # skip this many sites first (chunked full-state runs)
sheets: 20         # contact sheets to make when more labels are needed (20 crops each)
sheets_rare: 14    # extra sheets from OSM pickleball/overlay courts only, newest 3 years
min_labels: 150    # labeled crops required before training
force_label: false # make new sheets even if enough labels exist
run: 8             # bump to re-run with the same settings
