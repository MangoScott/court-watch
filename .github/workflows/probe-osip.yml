# Probe the Ohio Statewide Imagery Program services (not reachable from every
# network) and commit what they report: services, years available at Sawyer
# Point, and a test chip. Manual or on changes to the adapter.
name: Probe OSIP imagery

on:
  workflow_dispatch:
  push:
    paths: [scripts/02b_fetch_osip.py, .github/workflows/probe-osip.yml]

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Probe services and Sawyer Point
        run: python scripts/02b_fetch_osip.py --probe --lat 39.10279 --lon -84.49653 -v
      - name: Commit probe results
        run: |
          git config user.name "court-watch bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/osip
          git commit -m "OSIP probe results" || echo "nothing to commit"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
