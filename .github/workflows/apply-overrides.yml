# When reviewer corrections change, re-export the dataset and site data so the
# map and results reflect them, without re-running imagery or the classifier.
name: Apply review overrides

on:
  push:
    paths: [data/review/overrides.csv]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: overrides
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Re-export with overrides
        run: |
          test -f data/change/court_tracks_raw.json || { echo "::error::no court_tracks_raw.json committed yet; run the pipeline first"; exit 1; }
          python scripts/07_export.py --state OH
      - name: Commit
        run: |
          git config user.name "court-watch bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f site/data data/output
          git commit -m "Apply review overrides" || echo "nothing to commit"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
